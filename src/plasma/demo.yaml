# Demo library for `make seed`. Also a reference for writing your own files in info/.

platforms:
  - name: HBO Max
    url: https://www.hbomax.com
    kind: streaming       # Or console. Guessed from the name if left out.
  - name: PlayStation 5   # A website is optional.
    kind: console

movies:
  - name: Arrival
    year: 2016
    producer: FilmNation Entertainment
    status: completed
    rating: 9
    watched_on: 2024-03-02
    release_date: 2016-11-11
    duration: 116
    genres: [Drama, Sci-Fi]        # Pick from the genres in the app's form.
    age_restriction: 13+           # all, 7+, 13+, 16+ or 18+.
    description: A linguist is asked to talk to the aliens who have just landed.
    notes: Worth a rewatch once you know the ending.
  - name: Spirited Away
    year: 2001
    status: completed
    rating: 10
  - name: 1917   # A bare number works as a name.
    year: 2019
    status: completed
    rating: 8
  - name: Dune Part Two
    year: 2024
    status: planned                # Titles have no status unless you give them one.
  - name: Past Lives
    year: 2023
    status: planned

series:
  - name: Breaking Bad
    year: 2008
    seasons: [7, 13, 13, 13, 16]   # Episodes per season.
    status: completed              # Marks every episode watched.
    rating: 10
    genres: [Crime, Drama, Thriller]
    age_restriction: 18+
  - name: The Wire
    year: 2002
    platforms: [HBO Max]           # Created on the Platforms tab if it's new.
    seasons: [13, 12, 12, 13, 10]
    watched_through: S02E04        # Marks everything up to this episode watched.
    episodes:                      # Optional details for any episode.
      S01E01:
        duration: 60
        description: McNulty pushes for an investigation into a Baltimore drug crew.
  - name: Severance
    year: 2022
    platforms: [Apple TV]
    seasons: [9, 10]
    watched_through: S01E09
    rating: 9
  - name: Lost
    year: 2004
    seasons: [25, 24, 23, 14, 17, 18]
    watched_through: S02E10
    status: dropped                # Stays dropped until you change it.
  - name: The Bear
    year: 2022
    seasons: [8, 10, 10]

games:
  - name: Hades
    year: 2020
    producer: Supergiant Games
    owned: true                    # Games only.
    status: playing                # The singleplayer status.
    genres: [Action, Roguelike]
    age_restriction: 13+
    hours_played: 42               # Whole hours.
    platforms: [Steam]
  - name: Celeste
    year: 2018
    status: completed
    rating: 10
    watched_on: 2024-08-17         # The day you finished it.
    genres: [Platformer]
    age_restriction: 7+
  - name: Rocket League
    year: 2015
    singleplayer: false            # Games are singleplayer unless you say otherwise.
    multiplayer: true
    multiplayer_status: playing    # Like status, but it can't be completed.
    genres: [Sports, Racing]
    age_restriction: all
