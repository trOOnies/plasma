<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plasma{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">plasma</a>
    <nav>
      <a href="/titles">Library</a>
      <a href="/titles?kind=movie">Movies</a>
      <a href="/titles?kind=series">Series</a>
    </nav>
    <div class="add">
      <a class="button" href="/titles/new?kind=movie">+ Movie</a>
      <a class="button" href="/titles/new?kind=series">+ Series</a>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
