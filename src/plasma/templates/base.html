<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plasma{% endblock %}</title>
  <link rel="icon" href="/static/plasma.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/exit.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><img src="/static/plasma.svg" alt="" width="26" height="26">plasma</a>
    <nav>
      <a href="/titles?kind=series">Series</a>
      <a href="/titles?kind=movie">Movies</a>
      <a href="/titles?kind=game">Games</a>
      <a href="/plans">Plans</a>
      <a href="/platforms">Platforms</a>
      <a href="/duo">Duo</a>
      <a href="/help">Help</a>
    </nav>
    <div class="add">
      <a class="button" href="/titles/new?kind=series">+ Series</a>
      <a class="button" href="/titles/new?kind=movie">+ Movie</a>
      <a class="button" href="/titles/new?kind=game">+ Game</a>
    </div>
    <form class="exit-form" method="post" action="/exit">
      <button class="icon" aria-label="Save and exit" title="Save and exit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><path d="M6 21V4a1 1 0 0 1 1-1h7"/><path d="M14 2.5l5 1.7V21h-5z"/><path d="M16.5 12v.01"/></svg>
      </button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>&copy; 2026 Plasma by trOOnies</p>
    <p>Made with Claude Code</p>
  </footer>
</body>
</html>
